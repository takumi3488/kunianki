name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check committed font glyph coverage
        run: |
          python3 -m venv "$RUNNER_TEMP/font-check"
          "$RUNNER_TEMP/font-check/bin/pip" install -r scripts/requirements-assets.txt
          "$RUNNER_TEMP/font-check/bin/python" scripts/subset_font.py --check



      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig-dev libinput10 libgbm1

      - name: Install taplo
        shell: bash
        run: |
          if ! command -v taplo &> /dev/null; then
            curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
              | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo
          fi

      - name: Lint Cargo.toml
        shell: bash
        run: taplo lint Cargo.toml

      - name: Check Cargo.toml formatting
        shell: bash
        run: taplo fmt --check --option reorder_keys=true Cargo.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Slint LSP
        shell: bash
        run: |
          SLINT_VERSION=$(awk '/^name = "slint"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/slint-ui/slint/releases/download/v${SLINT_VERSION}/slint-lsp-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/slint-lsp/slint-lsp" "$HOME/.local/bin/slint-lsp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check Slint formatting
        shell: bash
        run: find . -path ./target -prune -o -name '*.slint' -exec bash -o pipefail -c 'for f do slint-lsp format "$f" | diff -u "$f" - || exit; done' bash {} +

      - name: Check Rust formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Run tests
        shell: bash
        run: cargo test --all-features

      - name: Run clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

  android-clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Use latest Android NDK and platform
        shell: bash
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          printf 'ANDROID_NDK_HOME=%s\n' "$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          # Slint's Android build script compiles Java against android.jar and fails to find one by itself here
          android_jar=$(find "$ANDROID_HOME/platforms" -path '*/android-[0-9]*/android.jar' | sort -V | tail -n 1)
          test -n "$android_jar"
          printf 'ANDROID_JAR=%s\n' "$android_jar" >> "$GITHUB_ENV"

      - name: Check Android target with Clippy
        run: cargo ndk -t arm64-v8a --platform 26 clippy --lib -- -D warnings

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build debug APK
        run: ./android/gradlew -p android :app:assembleDebug --console=plain

  android-emulator-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare smoke artifact directory
        run: |
          mkdir -p target/mobile-smoke/android-ci
          printf 'Android emulator smoke job started\n' > target/mobile-smoke/android-ci/workflow.log

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Android Rust target
        run: rustup target add x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Configure Android NDK and API 36 platform
        shell: bash
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          printf 'ANDROID_NDK_HOME=%s\n' "$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            sdkmanager "platforms;android-36"
          fi
          android_jar="$ANDROID_HOME/platforms/android-36/android.jar"
          test -f "$android_jar"
          printf 'ANDROID_JAR=%s\n' "$android_jar" >> "$GITHUB_ENV"

      - name: Build x86_64 debug APK
        shell: bash
        run: |
          set -o pipefail
          ./android/gradlew -p android :app:assembleDebug \
            -Pkunianki.androidAbi=x86_64 \
            -Pkunianki.androidSmoke=true --console=plain \
            2>&1 | tee target/mobile-smoke/android-ci/android-build.log

      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm

      - name: Run native Android smoke on API 36
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-linux-hw-accel: false
          disable-animations: true
          script: python3 scripts/android_smoke.py

      - name: Upload Android smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ci-smoke
          path: target/mobile-smoke/android-ci/
          if-no-files-found: warn
          retention-days: 14


  automerge:
    runs-on: ubuntu-latest
    needs: [test, android-clippy, android-emulator-smoke]
    if: github.event.pull_request.user.login == 'renovate[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: automerge
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67 # v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "automerge"
