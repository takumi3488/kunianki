[package]
edition = "2024"
name = "kunianki"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "7"

[build-dependencies]
slint-build = "1.18.1"

[lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
